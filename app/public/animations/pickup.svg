<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 64" fill="none">
  <title>取車：向上流動箭頭</title>
  <style>
    path { animation: pulse 1.8s ease-in-out infinite; opacity: .22; }
    .middle { animation-delay: .2s; }
    .top { animation-delay: .4s; }
    @keyframes pulse { 0%, 65%, 100% { opacity: .22; } 30% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { path { animation: none; opacity: .85; } }
  </style>
  <g stroke="#7dd3fc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 54 24 40 38 54"/>
    <path class="middle" d="M10 38 24 24 38 38"/>
    <path class="top" d="M10 22 24 8 38 22"/>
  </g>
</svg>
