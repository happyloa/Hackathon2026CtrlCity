AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  CtrlCity YouBike demo: private S3 static site, CloudFront, a small HTTP API,
  and an opt-in Amazon Bedrock AgentCore review boundary.

# The optional Harness ARN is empty only while AgentReviewEnabled is false.
# cfn-lint does not carry that condition through the SAM-generated IAM role.
Metadata:
  cfn-lint:
    config:
      ignore_checks:
        - W1030
        - W1031

Parameters:
  EnvironmentName:
    Type: String
    Default: hackathon
    Description: Lowercase deployment label used in tags and descriptions.
    AllowedPattern: '^[a-z0-9-]+$'
    MinLength: 2
    MaxLength: 24

  LiveFeedUrl:
    Type: String
    Default: https://data.ntpc.gov.tw/api/datasets/010e5b15-3823-4b20-b401-b1cf000550c5/json?page=0&size=2000
    Description: Public New Taipei YouBike source URL. Do not put a secret in this parameter.
    AllowedPattern: '^https://.+$'

  AgentCoreHarnessArn:
    Type: String
    Default: ''
    Description: Optional existing AgentCore Harness ARN. Empty keeps AI review disabled.
    AllowedPattern: '^$|^arn:[^:]+:bedrock-agentcore:[a-z0-9-]+:[0-9]{12}:harness/[A-Za-z][A-Za-z0-9_]*-[A-Za-z0-9]{10}$'

  AgentCoreHarnessQualifier:
    Type: String
    Default: DEFAULT
    Description: Existing Harness endpoint name. DEFAULT invokes the latest Harness version.
    AllowedPattern: '^[A-Za-z][A-Za-z0-9_]{0,47}$'

  CreateAgentCoreHarness:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Opt-in only. Creates a minimal fact-grounded Harness when true.

  AgentCoreHarnessName:
    Type: String
    Default: CtrlCityReview
    Description: Name used only when CreateAgentCoreHarness is true.
    AllowedPattern: '^[A-Za-z][A-Za-z0-9_]{0,39}$'

  AgentCoreModelId:
    Type: String
    Default: ''
    Description: Organizer-approved, region-local Bedrock foundation model ID for a managed Harness.
    AllowedPattern: '^$|^[A-Za-z0-9][A-Za-z0-9._:-]{0,255}$'

  LogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues:
      - 1
      - 3
      - 5
      - 7
      - 14
      - 30
    Description: Short CloudWatch retention for the temporary competition account.

  CreateKnowledgeSourceBucket:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Opt-in private S3 source for curated Markdown only; it does not create a vector store.

  EnableSnapshotCapture:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Opt-in. Captures the official live feed every 5 minutes into the site bucket.

  AlertEmail:
    Type: String
    Default: ''
    Description: Optional e-mail for snapshot capture alarms. Empty creates no SNS topic.
    AllowedPattern: '^$|^[^@\s]+@[^@\s]+\.[^@\s]+$'
  CreateBuildRunner:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Opt-in. Creates a private raw-data bucket and a CodeBuild project that rebuilds the historical profile.

  EnableDispatcherLogin:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Opt-in. Creates a Cognito user pool that protects the operator write endpoints.


  DispatcherSiteUrl:
    Type: String
    Default: ''
    AllowedPattern: '^$|^https://[a-zA-Z0-9.-]+$'
    Description: Existing site origin for Cognito callbacks; avoids a CloudFront/API dependency cycle.

Rules:
  LoginRequiresSiteUrl:
    RuleCondition: !Equals [!Ref EnableDispatcherLogin, 'true']
    Assertions:
      - Assert: !Not [!Equals [!Ref DispatcherSiteUrl, '']]
        AssertDescription: DispatcherSiteUrl is required for dispatcher login.

  ManagedHarnessRequiresModel:
    RuleCondition: !Equals [!Ref CreateAgentCoreHarness, 'true']
    Assertions:
      - Assert: !Not [!Equals [!Ref AgentCoreModelId, '']]
        AssertDescription: AgentCoreModelId is required when CreateAgentCoreHarness is true.

  UseOnlyOneHarnessSource:
    Assertions:
      - Assert: !Not
          - !And
            - !Equals [!Ref CreateAgentCoreHarness, 'true']
            - !Not [!Equals [!Ref AgentCoreHarnessArn, '']]
        AssertDescription: Use either an existing Harness ARN or create one, not both.

Conditions:
  CreateManagedHarness: !Equals [!Ref CreateAgentCoreHarness, 'true']
  AgentReviewEnabled: !Or
    - !Equals [!Ref CreateAgentCoreHarness, 'true']
    - !Not [!Equals [!Ref AgentCoreHarnessArn, '']]
  CreateKnowledgeSource: !Equals [!Ref CreateKnowledgeSourceBucket, 'true']

  CaptureEnabled: !Equals [!Ref EnableSnapshotCapture, 'true']
  CaptureAlertsEnabled: !And
    - !Condition CaptureEnabled
    - !Not [!Equals [!Ref AlertEmail, '']]
  BuildRunnerEnabled: !Equals [!Ref CreateBuildRunner, 'true']
  LoginEnabled: !Equals [!Ref EnableDispatcherLogin, 'true']

Resources:
  HistoryDataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: archive-raw-snapshots
            Status: Enabled
            Prefix: raw/
            Transitions:
              - StorageClass: GLACIER_IR
                TransitionInDays: 30
            ExpirationInDays: 180
      Tags:
        - { Key: project, Value: ctrlcity-youbike }
        - { Key: environment, Value: !Ref EnvironmentName }
        - { Key: purpose, Value: private-history-snapshots }

  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LifecycleConfiguration: !If
        - CaptureEnabled
        - Rules:
            - Id: archive-raw-snapshots
              Status: Enabled
              Prefix: raw/
              Transitions:
                - StorageClass: GLACIER_IR
                  TransitionInDays: 30
              ExpirationInDays: 180
        - !Ref AWS::NoValue
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: project
          Value: ctrlcity-youbike
        - Key: environment
          Value: !Ref EnvironmentName

  KnowledgeSourceBucket:
    Type: AWS::S3::Bucket
    Condition: CreateKnowledgeSource
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-temporary-knowledge-source
            Status: Enabled
            ExpirationInDays: 90
      Tags:
        - Key: project
          Value: ctrlcity-youbike
        - Key: environment
          Value: !Ref EnvironmentName
        - Key: purpose
          Value: agent-knowledge-source

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Description: !Sub '${EnvironmentName} CtrlCity private S3 access'
        Name: !Sub '${AWS::StackName}-site-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      AutoPublish: true
      Name: !Sub '${AWS::StackName}-spa-rewrite'
      FunctionConfig:
        Comment: Serve the Nuxt SPA shell for extensionless browser routes.
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var path = request.uri;
          var segment = path.substring(path.lastIndexOf('/') + 1);
          if (path === '/' || segment.indexOf('.') === -1) {
            request.uri = '/index.html';
          }
          return request;
        }

  OperationsApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Description: CtrlCity same-origin API for live data and opt-in AgentCore review.
      # One OpenAPI body owns all routes: API updates overwrite external routes.
      DefinitionBody:
        openapi: 3.0.1
        info: { title: CtrlCity Operations, version: '1.0' }
        paths:
          /api/v1/adjustments:
            get: &operatorRead
              responses: { default: { description: Operator document } }
              x-amazon-apigateway-integration: &operatorIntegration
                type: aws_proxy
                httpMethod: POST
                uri: !GetAtt OperationsApiFunction.Arn
                payloadFormatVersion: '2.0'
            put: &operatorWrite
              Fn::If:
                - LoginEnabled
                - responses: { default: { description: Saved operator document } }
                  security: [{ DispatcherJwt: [openid] }]
                  x-amazon-apigateway-integration: *operatorIntegration
                - !Ref AWS::NoValue
          /api/v1/events:
            get: *operatorRead
            put: *operatorWrite
          /api/v1/manual-routes:
            get: *operatorRead
            put: *operatorWrite
        components:
          securitySchemes:
            DispatcherJwt: !If
              - LoginEnabled
              - type: oauth2
                x-amazon-apigateway-authorizer:
                  type: jwt
                  identitySource: '$request.header.Authorization'
                  jwtConfiguration:
                    issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${DispatcherUserPool}'
                    audience: [!Ref DispatcherUserPoolClient]
              - !Ref AWS::NoValue
      DefaultRouteSettings:
        ThrottlingBurstLimit: 8
        ThrottlingRateLimit: 4
      RouteSettings:
        'POST /api/v1/agent-review':
          ThrottlingBurstLimit: 2
          ThrottlingRateLimit: 0.5
      Tags:
        project: ctrlcity-youbike
        environment: !Ref EnvironmentName

  AgentCoreExecutionRole:
    Type: AWS::IAM::Role
    Condition: CreateManagedHarness
    Properties:
      Description: Fixed-model execution role for the optional CtrlCity review Harness.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:harness/*'
      Policies:
        - PolicyName: invoke-configured-bedrock-model
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${AgentCoreModelId}'
      Tags:
        - Key: project
          Value: ctrlcity-youbike
        - Key: environment
          Value: !Ref EnvironmentName

  AgentReviewHarness:
    Type: AWS::BedrockAgentCore::Harness
    Condition: CreateManagedHarness
    Properties:
      HarnessName: !Ref AgentCoreHarnessName
      ExecutionRoleArn: !GetAtt AgentCoreExecutionRole.Arn
      Model:
        BedrockModelConfig:
          ModelId: !Ref AgentCoreModelId
          ApiFormat: converse_stream
          MaxTokens: 300
          Temperature: 0.1
      Memory:
        Disabled: {}
      MaxIterations: 2
      MaxTokens: 300
      TimeoutSeconds: 20
      SystemPrompt:
        - Text: >-
            你是新北市公共自行車風險分析說明助理。只能依據每次請求提供的結構化事實回答，
            不得新增站點、數值、時間、成因或宣稱已完成派車。所有建議都必須標示僅供人員查驗，
            並依照請求指定的 JSON 格式輸出。
      Tags:
        - Key: project
          Value: ctrlcity-youbike
        - Key: environment
          Value: !Ref EnvironmentName

  OperationsApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: aws/handler.lambdaHandler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 512
      Timeout: 29
      ReservedConcurrentExecutions: 2
      Description: Thin NTPC live proxy and guarded AgentCore review facade.
      Environment:
        Variables:
          SITE_BUCKET: !Ref SiteBucket
          OPERATOR_WRITE_ENABLED: !If [LoginEnabled, 'true', 'false']
          LIVE_FEED_URL: !Ref LiveFeedUrl
          AGENTCORE_HARNESS_ARN: !If
            - CreateManagedHarness
            - !GetAtt AgentReviewHarness.Arn
            - !Ref AgentCoreHarnessArn
          AGENTCORE_HARNESS_QUALIFIER: !If
            - CreateManagedHarness
            - DEFAULT
            - !Ref AgentCoreHarnessQualifier
      Policies:
        - Statement:
            - Sid: DetectMissingOperatorFiles
              Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt SiteBucket.Arn
            - Sid: ReadWriteOperatorFiles
              Effect: Allow
              Action: [s3:GetObject, s3:PutObject]
              Resource:
                - !Sub '${SiteBucket.Arn}/data/operational-adjustments.json'
                - !Sub '${SiteBucket.Arn}/data/demand-events.json'
                - !Sub '${SiteBucket.Arn}/data/manual-routes.json'
            - Sid: InvokeConfiguredAgentCoreHarness
              Effect: Allow
              Action:
                - bedrock-agentcore:InvokeHarness
                - bedrock-agentcore:InvokeAgentRuntime
              Resource:
                - !If
                  - AgentReviewEnabled
                  - !If
                    - CreateManagedHarness
                    - !GetAtt AgentReviewHarness.Arn
                    - !Ref AgentCoreHarnessArn
                  - !Sub 'arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:harness/DisabledHarness-0000000000'
                - !If
                  - AgentReviewEnabled
                  - !Sub
                    - '${HarnessArn}/harness-endpoint/*'
                    - HarnessArn: !If
                        - CreateManagedHarness
                        - !GetAtt AgentReviewHarness.Arn
                        - !Ref AgentCoreHarnessArn
                  - !Sub 'arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:harness/DisabledHarness-0000000000/harness-endpoint/*'
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref OperationsApi
            Path: /api/health
            Method: GET
        LiveStations:
          Type: HttpApi
          Properties:
            ApiId: !Ref OperationsApi
            Path: /api/v1/live-stations
            Method: GET
        AgentReview:
          Type: HttpApi
          Properties:
            ApiId: !Ref OperationsApi
            Path: /api/v1/agent-review
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - aws/handler.ts
        Format: cjs
        OutExtension:
          - .js=.cjs
        Minify: true
        Sourcemap: false
        Target: es2022

  OperationsApiLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/${OperationsApiFunction}'
      RetentionInDays: !Ref LogRetentionDays

  SnapshotCaptureFunction:
    Type: AWS::Serverless::Function
    Condition: CaptureEnabled
    Properties:
      CodeUri: ../
      Handler: aws/capture.captureHandler
      Runtime: nodejs24.x
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 60
      ReservedConcurrentExecutions: 1        # 單一寫入者：兩次執行絕不重疊
      Description: Captures the official live feed every 5 minutes into raw/, snapshots/ and state/.
      Environment:
        Variables:
          SITE_BUCKET: !Ref SiteBucket
          HISTORY_BUCKET: !Ref HistoryDataBucket
          LIVE_FEED_URL: !Ref LiveFeedUrl
      Policies:
        - Statement:
            - Sid: DetectMissingCheckpoint
              Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt SiteBucket.Arn
            - Sid: ReadWriteCapturePrefixesOnly
              Effect: Allow
              Action: [s3:GetObject, s3:PutObject]
              Resource:
                - !Sub '${SiteBucket.Arn}/snapshots/*'
                - !Sub '${SiteBucket.Arn}/state/*'
            - Sid: WritePrivateHistoryOnly
              Effect: Allow
              Action: s3:PutObject
              Resource: !Sub '${HistoryDataBucket.Arn}/raw/*'
      Events:
        EveryFiveMinutes:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(5 minutes)
            FlexibleTimeWindow:
              Mode: 'OFF'
            RetryPolicy:
              MaximumRetryAttempts: 1
              MaximumEventAgeInSeconds: 240
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [aws/capture.ts]
        Format: cjs
        OutExtension: [.js=.cjs]
        Minify: true
        Sourcemap: false
        Target: es2022

  SnapshotCaptureLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: CaptureEnabled
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/${SnapshotCaptureFunction}'
      RetentionInDays: !Ref LogRetentionDays

  ShortLivedDataCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Condition: CaptureEnabled
    Properties:
      CachePolicyConfig:
        Name: !Sub '${AWS::StackName}-short-lived-data'
        Comment: 60-second edge cache for scheduler-written JSON.
        MinTTL: 0
        DefaultTTL: 60
        MaxTTL: 120
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig: { CookieBehavior: none }
          HeadersConfig: { HeaderBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: none }

  CaptureAlertTopic:
    Type: AWS::SNS::Topic
    Condition: CaptureAlertsEnabled
    Properties:
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  SnapshotCaptureErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CaptureEnabled
    Properties:
      AlarmDescription: Snapshot capture failed twice in a row; latest.json is going stale.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref SnapshotCaptureFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [CaptureAlertsEnabled, [!Ref CaptureAlertTopic], []]

  SnapshotCaptureSilentAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CaptureEnabled
    Properties:
      AlarmDescription: Snapshot capture has not run for 15 minutes; the scheduler may be disabled.
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions: [{ Name: FunctionName, Value: !Ref SnapshotCaptureFunction }]
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: !If [CaptureAlertsEnabled, [!Ref CaptureAlertTopic], []]
  RawDataBucket:
    Type: AWS::S3::Bucket
    Condition: BuildRunnerEnabled
    DeletionPolicy: Retain                   # 原始資料不跟著 stack 刪
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: { Status: Enabled }
      Tags:
        - { Key: project, Value: ctrlcity-youbike }
        - { Key: environment, Value: !Ref EnvironmentName }
        - { Key: purpose, Value: raw-dataset-and-build-artifacts }

  BuildRunnerRole:
    Type: AWS::IAM::Role
    Condition: BuildRunnerEnabled
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: history-build
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Ref 'AWS::StackId'
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${AWS::StackName}-*'
              - Effect: Allow
                Action: [s3:GetObject, s3:ListBucket, s3:PutObject]
                Resource: [!GetAtt RawDataBucket.Arn, !Sub '${RawDataBucket.Arn}/*']
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt HistoryDataBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix: ['raw/*']
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${HistoryDataBucket.Arn}/raw/*'
              - Effect: Allow
                Action: [s3:GetObject, s3:ListBucket, s3:PutObject, s3:DeleteObject]
                Resource: [!GetAtt SiteBucket.Arn, !Sub '${SiteBucket.Arn}/*']
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}'

  HistoryBuildProject:
    Type: AWS::CodeBuild::Project
    Condition: BuildRunnerEnabled
    Properties:
      Name: !Sub '${AWS::StackName}-history-build'
      Description: Rebuilds dashboard.json and the live-profile shards from the raw dataset, then publishes the site.
      ServiceRole: !GetAtt BuildRunnerRole.Arn
      Artifacts: { Type: NO_ARTIFACTS }
      TimeoutInMinutes: 90
      ConcurrentBuildLimit: 1
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_LARGE      # 8 vCPU / 15 GB：data:profile 要 12 GB heap
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - { Name: RAW_DATA_BUCKET, Value: !Ref RawDataBucket }
          - { Name: HISTORY_BUCKET, Value: !Ref HistoryDataBucket }
          - { Name: SITE_BUCKET, Value: !Ref SiteBucket }
          - { Name: DISTRIBUTION_ID, Value: !Ref SiteDistribution }
          - { Name: AWS_STACK, Value: !Ref 'AWS::StackName' }
          - { Name: SNAPSHOT_CAPTURE_ENABLED, Value: !Ref EnableSnapshotCapture }
      Source:
        Type: S3
        Location: !Sub '${RawDataBucket}/source/repo.zip'
        BuildSpec: app/infra/buildspec-history.yml
      LogsConfig:
        CloudWatchLogs: { Status: ENABLED }
      Tags:
        - { Key: project, Value: ctrlcity-youbike }
        - { Key: environment, Value: !Ref EnvironmentName }
  DispatcherUserPool:
    Type: AWS::Cognito::UserPool
    Condition: LoginEnabled
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-dispatchers'
      AdminCreateUserConfig: { AllowAdminCreateUserOnly: true }     # 不開放自助註冊
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      MfaConfiguration: 'OFF'
      Policies:
        PasswordPolicy: { MinimumLength: 12, RequireUppercase: true, RequireLowercase: true, RequireNumbers: true, RequireSymbols: false }
      DeletionProtection: INACTIVE

  DispatcherUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Condition: LoginEnabled
    Properties:
      UserPoolId: !Ref DispatcherUserPool
      ClientName: ctrlcity-web
      GenerateSecret: false                                           # SPA 用 PKCE，不能有 secret
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: [!Sub '${DispatcherSiteUrl}/admin/callback']
      LogoutURLs: [!Sub '${DispatcherSiteUrl}/']
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 12
      TokenValidityUnits: { AccessToken: hours, IdToken: hours, RefreshToken: hours }

  DispatcherUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Condition: LoginEnabled
    Properties:
      UserPoolId: !Ref DispatcherUserPool
      Domain: !Sub '${AWS::StackName}-${AWS::AccountId}'

  OperatorApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref OperationsApiFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${OperationsApi}/*/*/api/v1/*'

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub '${EnvironmentName} CtrlCity YouBike demo'
        DefaultRootObject: index.html
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: site-s3
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref SiteOriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: operations-api
            DomainName: !Sub '${OperationsApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: site-s3
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewriteFunction.FunctionARN
        CacheBehaviors:
          - !If
            - CaptureEnabled
            - PathPattern: /snapshots/*
              TargetOriginId: site-s3
              ViewerProtocolPolicy: redirect-to-https
              Compress: true
              AllowedMethods: [GET, HEAD]
              CachedMethods: [GET, HEAD]
              CachePolicyId: !Ref ShortLivedDataCachePolicy
            - !Ref AWS::NoValue
          - !If
            - CaptureEnabled
            - PathPattern: /state/*
              TargetOriginId: site-s3
              ViewerProtocolPolicy: redirect-to-https
              Compress: true
              AllowedMethods: [GET, HEAD]
              CachedMethods: [GET, HEAD]
              CachePolicyId: !Ref ShortLivedDataCachePolicy
            - !Ref AWS::NoValue
          - PathPattern: /api/*
            TargetOriginId: operations-api
            ViewerProtocolPolicy: https-only
            Compress: true
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - POST
              - PATCH
              - DELETE
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
          MinimumProtocolVersion: TLSv1.2_2021
      Tags:
        - Key: project
          Value: ctrlcity-youbike
        - Key: environment
          Value: !Ref EnvironmentName

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyPublicRawSnapshots
            Effect: Deny
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/raw/*'
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}'

Outputs:
  HistoryDataBucketName:
    Description: Private raw snapshots; never a CloudFront origin or publish target.
    Value: !Ref HistoryDataBucket
  ApiFunctionName:
    Description: Lambda function updated by the GitHub deployment role.
    Value: !Ref OperationsApiFunction

  SiteUrl:
    Description: Public CloudFront URL for the final AWS demo.
    Value: !Sub 'https://${SiteDistribution.DomainName}'

  SiteBucketName:
    Description: Private S3 bucket targeted by the publish script.
    Value: !Ref SiteBucket

  DistributionId:
    Description: CloudFront distribution targeted by the publish script.
    Value: !Ref SiteDistribution

  ApiUrl:
    Description: Direct API URL for diagnostics. The browser should use the CloudFront same-origin /api path.
    Value: !Sub 'https://${OperationsApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'

  AgentReviewEnabled:
    Description: Whether POST /api/v1/agent-review can invoke an AgentCore Harness.
    Value: !If [AgentReviewEnabled, 'true', 'false']

  ManagedHarnessArn:
    Condition: CreateManagedHarness
    Description: ARN of the optional stack-managed AgentCore Harness.
    Value: !GetAtt AgentReviewHarness.Arn

  KnowledgeSourceBucketName:
    Condition: CreateKnowledgeSource
    Description: Private bucket for curated Markdown; never upload the raw competition CSV dataset.
    Value: !Ref KnowledgeSourceBucket

  SnapshotCaptureEnabled:
    Description: Whether the 5-minute snapshot capture is deployed. Read by aws:publish.
    Value: !Ref EnableSnapshotCapture

  RawDataBucketName:
    Condition: BuildRunnerEnabled
    Value: !Ref RawDataBucket
  HistoryBuildProjectName:
    Condition: BuildRunnerEnabled
    Value: !Ref HistoryBuildProject

  SnapshotCaptureFunctionName:
    Condition: CaptureEnabled
    Value: !Ref SnapshotCaptureFunction
  DispatcherLoginEnabled:
    Value: !Ref EnableDispatcherLogin
  UserPoolId:
    Condition: LoginEnabled
    Value: !Ref DispatcherUserPool
  UserPoolClientId:
    Condition: LoginEnabled
    Value: !Ref DispatcherUserPoolClient
  CognitoAuthority:
    Condition: LoginEnabled
    Value: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${DispatcherUserPool}'
  UserPoolDomain:
    Condition: LoginEnabled
    Value: !Sub 'https://${DispatcherUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com'
