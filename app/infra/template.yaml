AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  CtrlCity YouBike demo: private S3 static site, CloudFront, a small HTTP API,
  and an opt-in Amazon Bedrock AgentCore review boundary.

Parameters:
  EnvironmentName:
    Type: String
    Default: hackathon
    Description: Lowercase deployment label used in tags and descriptions.
    AllowedPattern: '^[a-z0-9-]+$'
    MinLength: 2
    MaxLength: 24

  LiveFeedUrl:
    Type: String
    Default: https://data.ntpc.gov.tw/api/datasets/010e5b15-3823-4b20-b401-b1cf000550c5/json?page=0&size=2000
    Description: Public New Taipei YouBike source URL. Do not put a secret in this parameter.
    AllowedPattern: '^https://.+$'

  AgentCoreHarnessArn:
    Type: String
    Default: ''
    Description: Optional existing AgentCore Harness ARN. Empty keeps AI review disabled.
    AllowedPattern: '^$|^arn:[^:]+:bedrock-agentcore:[a-z0-9-]+:[0-9]{12}:harness/[A-Za-z][A-Za-z0-9_]*-[A-Za-z0-9]{10}$'

  AgentCoreHarnessQualifier:
    Type: String
    Default: DEFAULT
    Description: Existing Harness endpoint name. DEFAULT invokes the latest Harness version.
    AllowedPattern: '^[A-Za-z][A-Za-z0-9_]{0,47}$'

  CreateAgentCoreHarness:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Opt-in only. Creates a minimal fact-grounded Harness when true.

  AgentCoreHarnessName:
    Type: String
    Default: CtrlCityReview
    Description: Name used only when CreateAgentCoreHarness is true.
    AllowedPattern: '^[A-Za-z][A-Za-z0-9_]{0,39}$'

  AgentCoreModelId:
    Type: String
    Default: ''
    Description: Organizer-approved, region-local Bedrock foundation model ID for a managed Harness.
    AllowedPattern: '^$|^[A-Za-z0-9][A-Za-z0-9._:-]{0,255}$'

  LogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues:
      - 1
      - 3
      - 5
      - 7
      - 14
      - 30
    Description: Short CloudWatch retention for the temporary competition account.

  CreateKnowledgeSourceBucket:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Opt-in private S3 source for curated Markdown only; it does not create a vector store.

Rules:
  ManagedHarnessRequiresModel:
    RuleCondition: !Equals [!Ref CreateAgentCoreHarness, 'true']
    Assertions:
      - Assert: !Not [!Equals [!Ref AgentCoreModelId, '']]
        AssertDescription: AgentCoreModelId is required when CreateAgentCoreHarness is true.

  UseOnlyOneHarnessSource:
    Assertions:
      - Assert: !Not
          - !And
            - !Equals [!Ref CreateAgentCoreHarness, 'true']
            - !Not [!Equals [!Ref AgentCoreHarnessArn, '']]
        AssertDescription: Use either an existing Harness ARN or create one, not both.

Conditions:
  CreateManagedHarness: !Equals [!Ref CreateAgentCoreHarness, 'true']
  AgentReviewEnabled: !Or
    - !Equals [!Ref CreateAgentCoreHarness, 'true']
    - !Not [!Equals [!Ref AgentCoreHarnessArn, '']]
  CreateKnowledgeSource: !Equals [!Ref CreateKnowledgeSourceBucket, 'true']

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: project
          Value: ctrlcity-youbike
        - Key: environment
          Value: !Ref EnvironmentName

  KnowledgeSourceBucket:
    Type: AWS::S3::Bucket
    Condition: CreateKnowledgeSource
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-temporary-knowledge-source
            Status: Enabled
            ExpirationInDays: 90
      Tags:
        - Key: project
          Value: ctrlcity-youbike
        - Key: environment
          Value: !Ref EnvironmentName
        - Key: purpose
          Value: agent-knowledge-source

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Description: !Sub '${EnvironmentName} CtrlCity private S3 access'
        Name: !Sub '${AWS::StackName}-site-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      AutoPublish: true
      Name: !Sub '${AWS::StackName}-spa-rewrite'
      FunctionConfig:
        Comment: Serve the Nuxt SPA shell for extensionless browser routes.
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var path = request.uri;
          var segment = path.substring(path.lastIndexOf('/') + 1);
          if (path === '/' || segment.indexOf('.') === -1) {
            request.uri = '/index.html';
          }
          return request;
        }

  OperationsApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Description: CtrlCity same-origin API for live data and opt-in AgentCore review.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 8
        ThrottlingRateLimit: 4
      RouteSettings:
        'POST /api/v1/agent-review':
          ThrottlingBurstLimit: 2
          ThrottlingRateLimit: 0.5
      Tags:
        project: ctrlcity-youbike
        environment: !Ref EnvironmentName

  AgentCoreExecutionRole:
    Type: AWS::IAM::Role
    Condition: CreateManagedHarness
    Properties:
      Description: Fixed-model execution role for the optional CtrlCity review Harness.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:harness/*'
      Policies:
        - PolicyName: invoke-configured-bedrock-model
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${AgentCoreModelId}'
      Tags:
        - Key: project
          Value: ctrlcity-youbike
        - Key: environment
          Value: !Ref EnvironmentName

  AgentReviewHarness:
    Type: AWS::BedrockAgentCore::Harness
    Condition: CreateManagedHarness
    Properties:
      HarnessName: !Ref AgentCoreHarnessName
      ExecutionRoleArn: !GetAtt AgentCoreExecutionRole.Arn
      Model:
        BedrockModelConfig:
          ModelId: !Ref AgentCoreModelId
          ApiFormat: converse_stream
          MaxTokens: 300
          Temperature: 0.1
      Memory:
        Disabled: {}
      MaxIterations: 2
      MaxTokens: 300
      TimeoutSeconds: 20
      SystemPrompt:
        - Text: >-
            你是新北市公共自行車調度覆核助理。只能依據每次請求提供的結構化事實回答，
            不得新增站點、數值、時間、成因或宣稱已完成派車。所有建議都必須標示需要人工覆核，
            並依照請求指定的 JSON 格式輸出。
      Tags:
        - Key: project
          Value: ctrlcity-youbike
        - Key: environment
          Value: !Ref EnvironmentName

  OperationsApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: aws/handler.lambdaHandler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 512
      Timeout: 29
      ReservedConcurrentExecutions: 2
      Description: Thin NTPC live proxy and guarded AgentCore review facade.
      Environment:
        Variables:
          LIVE_FEED_URL: !Ref LiveFeedUrl
          AGENTCORE_HARNESS_ARN: !If
            - CreateManagedHarness
            - !GetAtt AgentReviewHarness.Arn
            - !Ref AgentCoreHarnessArn
          AGENTCORE_HARNESS_QUALIFIER: !If
            - CreateManagedHarness
            - DEFAULT
            - !Ref AgentCoreHarnessQualifier
      Policies:
        - Statement:
            - Sid: InvokeConfiguredAgentCoreHarness
              Effect: Allow
              Action:
                - bedrock-agentcore:InvokeHarness
                - bedrock-agentcore:InvokeAgentRuntime
              Resource:
                - !If
                  - AgentReviewEnabled
                  - !If
                    - CreateManagedHarness
                    - !GetAtt AgentReviewHarness.Arn
                    - !Ref AgentCoreHarnessArn
                  - !Sub 'arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:harness/DisabledHarness-0000000000'
                - !If
                  - AgentReviewEnabled
                  - !Sub
                    - '${HarnessArn}/harness-endpoint/*'
                    - HarnessArn: !If
                        - CreateManagedHarness
                        - !GetAtt AgentReviewHarness.Arn
                        - !Ref AgentCoreHarnessArn
                  - !Sub 'arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:harness/DisabledHarness-0000000000/harness-endpoint/*'
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref OperationsApi
            Path: /api/health
            Method: GET
        LiveStations:
          Type: HttpApi
          Properties:
            ApiId: !Ref OperationsApi
            Path: /api/v1/live-stations
            Method: GET
        AgentReview:
          Type: HttpApi
          Properties:
            ApiId: !Ref OperationsApi
            Path: /api/v1/agent-review
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - aws/handler.ts
        Format: esm
        Minify: true
        Sourcemap: false
        Target: es2022

  OperationsApiLogGroup:
    Type: AWS::Logs::LogGroup
    DependsOn: OperationsApiFunction
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/${OperationsApiFunction}'
      RetentionInDays: !Ref LogRetentionDays

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub '${EnvironmentName} CtrlCity YouBike demo'
        DefaultRootObject: index.html
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: site-s3
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref SiteOriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: operations-api
            DomainName: !Sub '${OperationsApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: site-s3
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewriteFunction.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: operations-api
            ViewerProtocolPolicy: https-only
            Compress: true
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - POST
              - PATCH
              - DELETE
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
          MinimumProtocolVersion: TLSv1.2_2021
      Tags:
        - Key: project
          Value: ctrlcity-youbike
        - Key: environment
          Value: !Ref EnvironmentName

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}'

Outputs:
  SiteUrl:
    Description: Public CloudFront URL for the final AWS demo.
    Value: !Sub 'https://${SiteDistribution.DomainName}'

  SiteBucketName:
    Description: Private S3 bucket targeted by the publish script.
    Value: !Ref SiteBucket

  DistributionId:
    Description: CloudFront distribution targeted by the publish script.
    Value: !Ref SiteDistribution

  ApiUrl:
    Description: Direct API URL for diagnostics. The browser should use the CloudFront same-origin /api path.
    Value: !Sub 'https://${OperationsApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'

  AgentReviewEnabled:
    Description: Whether POST /api/v1/agent-review can invoke an AgentCore Harness.
    Value: !If [AgentReviewEnabled, 'true', 'false']

  ManagedHarnessArn:
    Condition: CreateManagedHarness
    Description: ARN of the optional stack-managed AgentCore Harness.
    Value: !GetAtt AgentReviewHarness.Arn

  KnowledgeSourceBucketName:
    Condition: CreateKnowledgeSource
    Description: Private bucket for curated Markdown; never upload the raw competition CSV dataset.
    Value: !Ref KnowledgeSourceBucket
